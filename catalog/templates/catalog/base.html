<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LocalLibrary{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f3f5f8; color: #263238; }
        header { background: #263b50; color: white; padding: 22px 5%; }
        header h1 { margin: 0 0 12px; }
        nav a { color: white; margin-right: 18px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .panel, .card { background: white; padding: 22px; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 2px 10px #0000000b; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 16px; }
        .number { font-size: 34px; font-weight: bold; color: #2874a6; }
        a { color: #176b9b; }
        input, button { padding: 10px; font-size: 15px; }
        footer { text-align: center; color: #667; padding: 25px; }
    </style>
</head>
<body>
<header>
    <h1><a href="{% url 'index' %}" style="color:white;text-decoration:none">LocalLibrary</a></h1>
    <nav>
        <a href="{% url 'index' %}">Главная</a>
        <a href="{% url 'books' %}">Книги</a>
        <a href="{% url 'authors' %}">Авторы</a>
        <a href="{% url 'admin:index' %}">Администрирование</a>
    </nav>
    <form action="{% url 'search' %}" method="get" style="margin-top:15px">
        <input type="search" name="q" placeholder="Название книги или автор">
        <button type="submit">Найти</button>
    </form>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Учебный проект на Django — LocalLibrary</footer>
</body>
</html>
